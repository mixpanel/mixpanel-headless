name: CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "conformance/**"
      - "pyproject.toml"
      - "justfile"
      - ".github/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "conformance/**"
      - "pyproject.toml"
      - "justfile"
      - ".github/**"

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Type check with mypy
        run: uv run mypy src/ tests/

      - name: Docstring coverage with interrogate
        # Same gates as `just docstring-cov`: every definition in src/ and
        # conformance/ (100%), and 95% of tests/.
        run: |
          uv run interrogate src/
          uv run interrogate tests/ --fail-under=95
          uv run interrogate conformance/ --fail-under=100

      - name: Run tests with pytest
        if: matrix.python-version != '3.12'
        run: uv run pytest
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Run tests with coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=src/mixpanel_headless --cov-report=term-missing --cov-report=xml --cov-fail-under=90
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Upload coverage to codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build
