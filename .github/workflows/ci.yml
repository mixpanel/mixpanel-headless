name: CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "conformance/**"
      - "pyproject.toml"
      - "justfile"
      - ".github/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "conformance/**"
      - "pyproject.toml"
      - "justfile"
      - ".github/**"

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Type check with mypy
        run: uv run mypy src/ tests/

      - name: Run tests with pytest
        if: matrix.python-version != '3.12'
        run: uv run pytest
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Run tests with coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=src/mixpanel_headless --cov-report=term-missing --cov-report=xml --cov-fail-under=90
        env:
          HYPOTHESIS_PROFILE: ci

      - name: Upload coverage to codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false

      - name: Build package
        if: matrix.python-version == '3.12'
        run: uv build

  # TS-port Phase-1 verification rig (design D8). Sibling of `test`, runs in
  # parallel: it re-syncs its own env, and a conformance failure is meaningful
  # even if `test` also fails. Every step except the drift check has a
  # `just check` counterpart (typecheck / conformance recipes); the drift
  # re-extraction is CI-only but derives purely from committed state.
  conformance:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # fetch-depth: 0 — the stamp-provenance guard below runs
      # `git merge-base --is-ancestor <stamp> origin/main`, which needs the
      # full history, not the default single-commit checkout.
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      # The D8 drift check byte-compares the re-extracted manifest, whose
      # tool_versions record the EXTRACTION interpreter — so this job must
      # run the exact Python the committed corpus was recorded with, or
      # manifest.json drifts on the version string alone (first-CI-run
      # finding, 2026-08-17: job ran 3.12.13 vs recorded 3.14.6). Reading
      # the pin from the manifest keeps this self-synchronizing across
      # future re-pins.
      - name: Pin Python to the corpus extraction interpreter
        run: |
          PY=$(jq -r .tool_versions.python conformance/vectors/manifest.json)
          uv python install "$PY"
          uv python pin "$PY"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Typecheck conformance tooling
        run: uv run mypy conformance/

      - name: Conformance tooling unit tests
        run: uv run pytest conformance/tests -o addopts="" -q

      - name: Corpus runner
        run: uv run pytest conformance/runner -o addopts="" -q

      # Stamp-provenance guard (conformance/record/check_stamps.py). The
      # drift check below injects the committed manifest's own stamps back
      # into the re-extraction, so it can never notice a WRONG stamp. This
      # step checks that manifest.source_commit, every extracted
      # $bundle.source_commit, and every contract generated_from is a
      # 40-hex SHA reachable from main (rule 1) and, on pull requests, that
      # in-scope corpus content did not change without the stamp changing
      # (rule 2 — the PR #223 failure mode: 68 new vectors landed under the
      # previous pin). Protocol: conformance/record/README.md, "Which SHA
      # to stamp".
      - name: Stamp-provenance guard
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          BASE_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_ARGS="--base-ref origin/main"
          fi
          uv run python -m conformance.record.check_stamps --main-ref origin/main $BASE_ARGS

      # Re-extracts the full corpus with the committed manifest's own stamps
      # injected back in (D3: date/commit are inputs, never wall clock or
      # git rev-parse), then byte-diffs bidirectionally against the committed
      # vectors (conformance.record.diff, D8 normative semantics). Any drift
      # fails the PR. `uv run python -m pytest` (not bare `uv run pytest`) is
      # required so the repo root lands on sys.path for the plugin import
      # (PR-5 finding, see conformance/record/README.md).
      - name: Record-mode drift check
        run: |
          uv run python -m pytest tests -p conformance.record.plugin \
            --mp-record-vectors=/tmp/re-extract \
            --mp-record-date=$(jq -r .extraction_date conformance/vectors/manifest.json) \
            --mp-record-commit=$(jq -r .source_commit conformance/vectors/manifest.json) \
            -o addopts="" -m "not live" $(cat conformance/record/exclusions.args)
          uv run python -m conformance.record.diff /tmp/re-extract conformance/vectors
        env:
          HYPOTHESIS_PROFILE: ci
