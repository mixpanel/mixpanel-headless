name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4
      - name: Build sdist + wheel
        run: uv build --python 3.12
      - name: Verify built version matches release tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          WHEEL=$(ls dist/*.whl | head -1)
          PKG_VER=$(echo "$WHEEL" | sed -E 's/.*-([0-9][^-]*)-.*\.whl/\1/')
          if [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Release tag v$TAG does not match built package version $PKG_VER. Bump __version__ in src/mixpanel_headless/__init__.py to match the tag."
            exit 1
          fi
          echo "✓ Tag v$TAG matches built version $PKG_VER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 (v1.14.0)
