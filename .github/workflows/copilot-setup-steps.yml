name: "Copilot Setup Steps"

# Environment for Copilot code review AND the Copilot cloud agent.
# Copilot code review runs these steps before each review (unless a
# .github/workflows/copilot-code-review.yml exists), then uses uv, pytest,
# and `mp help` from this environment. Do not delete this file because the
# cloud agent is idle.
#
# The push and pull_request triggers run the steps when this file changes, so
# a broken setup shows up in CI. workflow_dispatch allows a manual run.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be named `copilot-setup-steps`. Copilot honors only steps,
  # permissions, runs-on, services, snapshot, and timeout-minutes (max 59).
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Copilot gets its own token for its operations. The checkout below needs
    # only read access.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dependencies
        run: uv sync --all-extras

      # Copilot continues after a failed setup step, so make a broken install
      # fail here with a clear line in the log.
      - name: Verify install
        run: uv run mp --version
